<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cérebro Vivo</title>
<style>
  :root{
    --bg:#ffffff; --panel:#fafafa; --ink:#111111; --muted:#9a9a9a;
    --line:#d8d8d8; --leaf:#b5b5b5; --accent:#111; --halo:#000;
    --shadow:0 8px 30px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  #stage{position:fixed;inset:0;display:block;cursor:grab}
  #stage.dragging{cursor:grabbing}

  /* top bar */
  .bar{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:20;pointer-events:none}
  .bar > *{pointer-events:auto}
  .brand{font-weight:700;letter-spacing:.3px;font-size:14px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .search{flex:0 1 240px;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
  .search input{border:0;background:transparent;outline:none;font-size:13px;width:100%;color:var(--ink)}
  .btn{font-size:12.5px;font-weight:600;padding:7px 12px;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:10px;cursor:pointer;transition:.15s}
  .btn:hover{opacity:.85}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .spacer{flex:1}

  /* editor panel */
  .editor{position:fixed;top:60px;left:12px;width:320px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:19;overflow:hidden;transform:translateX(0);transition:transform .25s ease, opacity .25s;opacity:1}
  .editor.hidden{transform:translateX(-120%);opacity:0;pointer-events:none}
  .editor h3{margin:0;padding:12px 14px 6px;font-size:13px}
  .editor .hint{padding:0 14px 8px;font-size:11.5px;color:var(--muted);line-height:1.45}
  .editor textarea{width:100%;height:280px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;resize:none;outline:none;background:#fff;color:var(--ink)}
  .editor .row{display:flex;gap:8px;padding:10px 14px}
  .editor .row .btn{flex:1;text-align:center}

  /* detail popover */
  .detail{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;z-index:21;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;max-width:80vw}
  .detail.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .detail b{font-size:14px}
  .detail span{color:#bdbdbd}

  /* note panel */
  .note{position:fixed;top:60px;right:12px;width:320px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:19;display:flex;flex-direction:column;overflow:hidden;transform:translateX(0);transition:transform .25s ease,opacity .25s;opacity:1}
  .note.hidden{transform:translateX(120%);opacity:0;pointer-events:none}
  .note .nhead{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 8px}
  .note .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:0 0 auto;background:#111}
  .note .dot.leaf{background:#b5b5b5}
  .note .ntitle{flex:1;min-width:0}
  .note .ntitle b{font-size:15px;line-height:1.25;display:block;word-break:break-word}
  .note .ntitle em{font-style:normal;font-size:11px;color:var(--muted)}
  .note .nclose{cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;border-radius:6px}
  .note .nclose:hover{background:var(--panel);color:var(--ink)}
  .note textarea{width:100%;min-height:150px;max-height:46vh;border:0;border-top:1px solid var(--line);padding:12px 14px;font-size:13px;line-height:1.55;resize:vertical;outline:none;background:#fff;color:var(--ink);font-family:inherit}
  .note textarea::placeholder{color:#c2c2c2}
  .note .nfoot{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
  .note .nfoot .ok{color:#1a8a3a;opacity:0;transition:.2s}
  .note .nfoot .ok.show{opacity:1}
  .note .nav{margin-left:auto;display:flex;gap:4px}
  .note .nav button{border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-size:12px;padding:3px 8px;color:var(--ink)}
  .note .nav button:hover{background:#fff}

  /* legend / help */
  .foot{position:fixed;bottom:12px;right:12px;font-size:11px;color:var(--muted);z-index:18;text-align:right;line-height:1.6;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-family:inherit;font-size:10.5px}
  @media (max-width:640px){ .editor{width:calc(100vw - 24px)} .search{flex-basis:120px} .foot{display:none} }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="bar">
  <div class="brand">🧠 Cérebro Vivo</div>
  <div class="search"><span style="color:var(--muted);font-size:13px">⌕</span><input id="q" placeholder="buscar nó…" autocomplete="off"></div>
  <div class="spacer"></div>
  <button class="btn ghost" id="toggleEdit">✎ Texto</button>
  <button class="btn ghost" id="fit">⤢ Centrar</button>
  <button class="btn" id="png">↧ PNG</button>
</div>

<div class="editor" id="editor">
  <h3>Cole seu texto</h3>
  <div class="hint">Use <b>#</b> p/ o centro, <b>##</b> p/ ramos, <b>-</b> p/ folhas. Ou cole texto solto: a 1ª linha vira o centro, as demais viram ramos.</div>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="row">
    <button class="btn" id="gen">Gerar cérebro</button>
    <button class="btn ghost" id="sample">Exemplo</button>
  </div>
</div>

<div class="detail" id="detail"></div>

<div class="note hidden" id="note">
  <div class="nhead">
    <span class="dot" id="nDot"></span>
    <div class="ntitle"><b id="nName">—</b><em id="nMeta"></em></div>
    <span class="nclose" id="nClose">✕</span>
  </div>
  <textarea id="nText" placeholder="Escreva sobre este tema…" spellcheck="false"></textarea>
  <div class="nfoot"><span class="ok" id="nOk">✓ salvo</span><span class="nav"><button id="nPrev">‹</button><button id="nNext">›</button></span></div>
</div>
<div class="foot">
  arraste o fundo p/ mover · roda p/ zoom · arraste um nó · clique p/ focar<br>
  <kbd>duplo-clique</kbd> solta o nó · <kbd>Esc</kbd> limpa o foco
</div>

<script>
"use strict";
const SAMPLE = `# Cyber 30 Dias
## Security+
- Fundamentos
- Ameaças
- Arquitetura
- Operações
- GRC
## CEH v13
- Recon
- Scanning
- Enumeração
- Hacking de sistema
- Web
## OSCP / PEN-200
- Enumeração
- Exploração
- Buffer Overflow
- PrivEsc Linux
- PrivEsc Windows
- Active Directory
## CISSP
- 8 domínios CBK
- Segurança e Risco
- Ativos
- Criptografia
- Arquitetura
## Laboratório
- TryHackMe
- HackTheBox
- PortSwigger

## Cronograma
- Dias 1-10
- Dias 11-20

## Red Team
- Descoberta de hosts
- Enumeração SMB
- Fuzzing web
- SQL Injection

- Reverse shells
- Pivoting
## Blue Team

- Resposta a incidentes

/* conteúdo semente por tema (exemplo cyber) */
const SEED = {
"Cyber 30 Dias":"Plano intensivo de 30 dias (~300 h, ~10 h/dia) cobrindo o prático de Security+, CEH, OSCP e CISSP. Teoria curta de manhã, laboratório à tarde.",
"Security+":"CompTIA SY0-701. A certificação de entrada mais reconhecida — base defensiva e de conceitos de segurança.",
"Fundamentos":"Conceitos de segurança, tríade CIA (confidencialidade, integridade, disponibilidade), tipos de controle e de ameaça.",
"Ameaças":"Atores de ameaça, vetores de ataque, engenharia social, malware e indicadores de comprometimento (IoC).",
"Arquitetura":"Design seguro de redes: zero trust, segmentação, nuvem, resiliência e modelos de segurança.",
"Operações":"Monitoramento, hardening, resposta a incidentes e forense básica — o dia a dia do SOC.",
"GRC":"Governança, risco e conformidade: políticas, frameworks, auditoria e gestão de risco.",
"CEH v13":"EC-Council. Visão ofensiva ampla: as 5 fases do hacking ético, do recon a cobrir rastros.",
"Recon":"Reconhecimento passivo e ativo: OSINT, footprinting, enumeração de DNS e e-mails.",
"Scanning":"Varredura de rede e portas (nmap), descoberta de serviços e detecção de vulnerabilidades.",
"Enumeração":"O passo mais importante: extrair usuários, shares, serviços e versões para mapear a superfície de ataque.",
"Hacking de sistema":"Ganho de acesso, escalonamento de privilégios, execução e manutenção de acesso.",
"Web":"Ataques a aplicações web: OWASP Top 10, SQLi, XSS e falhas de autenticação.",
"OSCP / PEN-200":"OffSec. A certificação prática mais respeitada: exame de 24 h comprometendo máquinas reais. 'Try Harder'.",
"Exploração":"Encontrar e adaptar exploits públicos, explorar serviços e aplicações até obter shell.",
"Buffer Overflow":"Stack overflow clássico: controle de EIP, badchars, shellcode. Tema quase garantido no exame.",
"PrivEsc Linux":"De usuário a root: SUID, cron, kernel exploits, sudo mal configurado, GTFOBins.",
"PrivEsc Windows":"De usuário a SYSTEM: serviços, tokens, AlwaysInstallElevated, unquoted paths, PrivescCheck.",
"Active Directory":"Ataques a domínio: Kerberoasting, AS-REP roasting, pass-the-hash, BloodHound, movimento lateral.",
"CISSP":"ISC2. Certificação de gestão: os 8 domínios do CBK. Mais estratégica que técnica, exige experiência.",
"8 domínios CBK":"Segurança e Risco, Ativos, Arquitetura, Redes, IAM, Avaliação, Operações e Desenvolvimento seguro.",
"Segurança e Risco":"Gestão de risco, governança, conformidade legal, ética e continuidade de negócio.",
"Ativos":"Classificação, propriedade, retenção e proteção de dados ao longo do ciclo de vida.",
"Criptografia":"Simétrica, assimétrica, hashing, PKI, assinatura digital e gestão de chaves.",
"Laboratório":"Ambiente próprio e legal: VMs e plataformas que autorizam o ataque. Nunca teste alvos de terceiros sem autorização.",
"TryHackMe":"Trilhas guiadas e salas por tema. Ideal para fundamentos e aquecer antes do HTB.",
"HackTheBox":"Máquinas realistas e Academy. Ótimo para OSCP e prática ofensiva séria.",
"PortSwigger":"Web Security Academy: labs gratuitos e profundos de SQLi, XSS, SSRF e mais.",
"Proving Grounds":"Labs da OffSec no estilo do exame OSCP — Practice (grátis) e Play.",
"Cronograma":"4 semanas, ~10 h/dia. Teoria de manhã, laboratório à tarde, revisão à noite.",
"Dias 1-10":"Fundamentos, Security+, recon e enumeração. Monta o lab e aquece.",
"Dias 11-20":"Exploração web, hacking de sistema e PrivEsc Linux/Windows. Núcleo prático do OSCP.",
"Dias 21-30":"Active Directory, buffer overflow, simulados e revisão para os exames.",
"Simulados":"Provas cronometradas e máquinas de exame para medir prontidão e ajustar o foco.",
"Red Team":"Ofensiva prática: as técnicas que você executa na mão nos laboratórios.",
"Descoberta de hosts":"Identificar máquinas vivas e portas abertas: nmap, ping sweep, masscan.",
"Enumeração SMB":"enum4linux, smbclient, smbmap: shares, usuários e versões do Windows.",
"Fuzzing web":"Descobrir diretórios, vhosts e arquivos: ffuf, gobuster, feroxbuster.",
"SQL Injection":"Injeção de SQL para extrair dados ou burlar login: manual e com sqlmap.",
"XSS":"Cross-site scripting: refletido, armazenado e DOM. Roubo de sessão e payloads.",
"LFI":"Local File Inclusion: ler arquivos do servidor e escalar para RCE via log poisoning.",
"Reverse shells":"Obter shell de volta: bash, nc, Python, PowerShell — e estabilizar o tty.",
"Pivoting":"Mover-se por redes internas: túneis SSH, chisel, proxychains.",
"Blue Team":"Defesa: detectar, responder e endurecer. O outro lado da moeda.",
"Logs e SIEM":"Coleta e correlação de logs: Splunk, ELK, Wazuh. Caça a ameaças (threat hunting).",
"Resposta a incidentes":"Ciclo IR: preparação, detecção, contenção, erradicação, recuperação e lições aprendidas.",
"Hardening":"Reduzir superfície: baselines CIS, patching, políticas e desativar o que não se usa."
};

/* ---------- parser: texto -> {nodes, links} ---------- */
function parse(text){
  const lines = text.replace(/\r/g,'').split('\n').map(l=>l.replace(/\t/g,'  ')).filter(l=>l.trim().length);
  let nodes=[], links=[], id=0;
  const mk=(label,depth)=>{const n={id:id++,label:label.trim(),depth,x:0,y:0,vx:0,vy:0,pinned:false}; nodes.push(n); return n;};
  // structured markers?
  const hasMarkers = lines.some(l=>/^(#{1,3}\s|[-*•]\s)/.test(l.trim()));
  let center=null, branch=null;
  if(hasMarkers){
    for(const raw of lines){
      const l=raw.trim();
      if(/^#\s/.test(l)){ center = mk(l.replace(/^#\s+/,''),0); }
      else if(/^##\s/.test(l)){ const b=mk(l.replace(/^#{2}\s+/,''),1); branch=b; if(center) links.push([center.id,b.id]); }
      else if(/^###\s/.test(l)||/^[-*•]\s/.test(l)){ const leaf=mk(l.replace(/^(#{3}\s+|[-*•]\s+)/,''),2); if(branch) links.push([branch.id,leaf.id]); else if(center) links.push([center.id,leaf.id]); }
      else { // bare line in structured mode
        if(!center){ center=mk(l,0); } else { const b=mk(l,1); branch=b; links.push([center.id,b.id]); }
      }
    }
  } else {
    // free text: first line = center, each next line = branch; split by commas into leaves
    center = mk(lines[0],0);
    for(let i=1;i<lines.length;i++){
      const parts=lines[i].split(/[,;·|]/).map(s=>s.trim()).filter(Boolean);
      const b=mk(parts[0]||lines[i],1); links.push([center.id,b.id]); branch=b;
      for(let j=1;j<parts.length;j++){ const leaf=mk(parts[j],2); links.push([b.id,leaf.id]); }
    }
  }
  if(!center && nodes.length){ nodes[0].depth=0; }
  return {nodes,links};
}

/* ---------- graph state + physics ---------- */
const cv=document.getElementById('stage'), ctx=cv.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1);
let G={nodes:[],links:[]}, adj=new Map();
let view={x:0,y:0,k:1}, target={x:0,y:0,k:1};
let focus=null, hoverNode=null, dragNode=null, panning=false, last={x:0,y:0}, query='';
let noteNode=null, centerLabel='';

function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; }
addEventListener('resize',resize); resize();

function build(text){
  G=parse(text);
  adj=new Map(); G.nodes.forEach(n=>adj.set(n.id,new Set()));
  G.links.forEach(([a,b])=>{adj.get(a).add(b);adj.get(b).add(a);});
  // seed positions radially
  const center=G.nodes.find(n=>n.depth===0)||G.nodes[0];
  if(center){center.x=0;center.y=0;}
  const branches=G.nodes.filter(n=>n.depth===1);
  branches.forEach((b,i)=>{const a=(i/branches.length)*Math.PI*2; b.x=Math.cos(a)*220; b.y=Math.sin(a)*220;
    const leaves=[...adj.get(b.id)].map(id=>G.nodes[id]).filter(n=>n&&n.depth===2);
    leaves.forEach((lf,j)=>{const spread=(j-(leaves.length-1)/2)*0.35; lf.x=b.x+Math.cos(a+spread)*140; lf.y=b.y+Math.sin(a+spread)*140;});
  });
  centerLabel=(center&&center.label)||'mapa';
  let saved={}; try{ saved=JSON.parse(localStorage.getItem('cerebro:'+centerLabel)||'{}'); }catch(_){}
  for(const n of G.nodes){ n.note = (saved[n.label]!=null?saved[n.label]:(SEED[n.label]||'')); }
  focus=null; closeNote(); fit(true);
}

function radius(n){ return n.depth===0?26:n.depth===1?12:5; }

function tick(){
  const N=G.nodes;
  // repulsion (Barnes-hut-lite: all pairs, graphs are small)
  for(let i=0;i<N.length;i++){
    const a=N[i];
    for(let j=i+1;j<N.length;j++){
      const b=N[j]; let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+0.01; let d=Math.sqrt(d2);
      const rep=4200/d2; const fx=dx/d*rep, fy=dy/d*rep;
      a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
    }
  }
  // springs
  for(const [s,t] of G.links){
    const a=N[s],b=N[t]; let dx=b.x-a.x, dy=b.y-a.y; let d=Math.sqrt(dx*dx+dy*dy)+.01;
    const rest=(a.depth===0||b.depth===0)?190:95; const k=(d-rest)*0.012;
    const fx=dx/d*k, fy=dy/d*k; a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  // gravity to center + integrate
  for(const n of N){
    n.vx+=(-n.x)*0.0012; n.vy+=(-n.y)*0.0012;
    if(n===dragNode){continue;}
    if(n.depth===0 && !n.pinned){ n.vx+=(-n.x)*0.02; n.vy+=(-n.y)*0.02; }
    n.vx*=0.86; n.vy*=0.86;
    if(!n.pinned){ n.x+=n.vx; n.y+=n.vy; }
  }
}

/* ---------- transforms ---------- */
function toScreen(x,y){ return [ (x-view.x)*view.k+cv.width/2/DPR, (y-view.y)*view.k+cv.height/2/DPR ]; }
function toWorld(px,py){ return [ (px-cv.width/2/DPR)/view.k+view.x, (py-cv.height/2/DPR)/view.k+view.y ]; }

function fit(instant){
  if(!G.nodes.length)return;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const n of G.nodes){minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x);maxy=Math.max(maxy,n.y);}
  const w=innerWidth, h=innerHeight, pad=120;
  const k=Math.min((w-pad)/Math.max(1,maxx-minx),(h-pad)/Math.max(1,maxy-miny),2.2);
  target={x:(minx+maxx)/2, y:(miny+maxy)/2, k:Math.max(.25,k)};
  if(instant){view={...target};}
}

/* ---------- draw ---------- */
function roundLabel(n,screenX,screenY,r){
  const isCenter=n.depth===0, isBranch=n.depth===1;
  const dim = (focus && !focus.set.has(n.id)) || (query && !n.label.toLowerCase().includes(query));
  ctx.globalAlpha = dim?0.18:1;
  // node dot
  ctx.beginPath(); ctx.arc(screenX,screenY,r,0,7);
  if(isCenter){ ctx.fillStyle='#111'; ctx.fill(); }
  else if(isBranch){ ctx.fillStyle='#111'; ctx.fill(); }
  else { ctx.fillStyle='#b5b5b5'; ctx.fill(); }
  // highlight ring if focused/hover
  if(n===hoverNode || (focus&&focus.node===n)){ ctx.lineWidth=2; ctx.strokeStyle='#000'; ctx.beginPath(); ctx.arc(screenX,screenY,r+4,0,7); ctx.stroke(); }
  // label
  const fs = isCenter?15:isBranch?13:11.5;
  ctx.font=(isCenter||isBranch?'600 ':'400 ')+fs+'px -apple-system,Inter,Segoe UI,sans-serif';
  ctx.fillStyle= isCenter?'#fff': '#222';
  ctx.textBaseline='middle';
  if(isCenter){
    ctx.textAlign='center';
    const words=n.label.split(' ');
    if(words.length>1 && n.label.length>8){ ctx.fillText(words.slice(0,Math.ceil(words.length/2)).join(' '),screenX,screenY-7); ctx.fillText(words.slice(Math.ceil(words.length/2)).join(' '),screenX,screenY+8);}
    else ctx.fillText(n.label,screenX,screenY);
  } else {
    ctx.textAlign='left'; ctx.fillStyle='#222';
    ctx.fillText(n.label, screenX+r+6, screenY);
  }
  ctx.globalAlpha=1;
}

function render(){
  tick();
  // ease view
  view.x+=(target.x-view.x)*0.12; view.y+=(target.y-view.y)*0.12; view.k+=(target.k-view.k)*0.12;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  // halo behind center
  const c=G.nodes.find(n=>n.depth===0);
  if(c){ const [sx,sy]=toScreen(c.x,c.y); const grd=ctx.createRadialGradient(sx,sy,10,sx,sy,170*view.k); grd.addColorStop(0,'rgba(0,0,0,0.05)'); grd.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(sx,sy,170*view.k,0,7); ctx.fill(); }
  // links
  for(const [s,t] of G.links){
    const a=G.nodes[s],b=G.nodes[t]; const [ax,ay]=toScreen(a.x,a.y),[bx,by]=toScreen(b.x,b.y);
    const dim=(focus && !(focus.set.has(a.id)&&focus.set.has(b.id)));
    ctx.strokeStyle= dim?'rgba(0,0,0,0.05)':'rgba(0,0,0,0.18)';
    ctx.lineWidth=(a.depth===0||b.depth===0)?1.3:0.8;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  // nodes (leaves first, center last on top)
  const order=[...G.nodes].sort((a,b)=>a.depth-b.depth===0?0:b.depth-a.depth);
  for(const n of order){ const [sx,sy]=toScreen(n.x,n.y); roundLabel(n,sx,sy,radius(n)); }
  requestAnimationFrame(render);
}

/* ---------- picking ---------- */
function pick(px,py){
  let best=null,bd=1e9;
  for(const n of G.nodes){ const [sx,sy]=toScreen(n.x,n.y); const r=radius(n)+ (n.depth===2?18:8); const d=Math.hypot(sx-px,sy-py); if(d<r && d<bd){bd=d;best=n;} }
  return best;
}
function setFocus(n){
  if(!n){focus=null; closeNote(); return;}
  const set=new Set([n.id]); for(const nb of adj.get(n.id))set.add(nb);
  focus={node:n,set}; openNote(n);
}
const note=document.getElementById('note'), nName=document.getElementById('nName'),
      nMeta=document.getElementById('nMeta'), nText=document.getElementById('nText'),
      nDot=document.getElementById('nDot'), nOk=document.getElementById('nOk');
let noteTimer=null;
function openNote(n){
  noteNode=n;
  nName.textContent=n.label;
  const deg=adj.get(n.id).size;
  nMeta.textContent=(n.depth===0?'centro':n.depth===1?'ramo':'folha')+' · '+deg+' conexõe'+(deg===1?'':'s');
  nDot.className='dot'+(n.depth===2?' leaf':'');
  nText.value=n.note||'';
  nText.placeholder='Escreva sobre "'+n.label+'"…';
  note.classList.remove('hidden');
}
function closeNote(){ noteNode=null; note.classList.add('hidden'); }
function persist(){
  if(!centerLabel) return;
  try{ const o={}; for(const n of G.nodes){ if(n.note) o[n.label]=n.note; } localStorage.setItem('cerebro:'+centerLabel, JSON.stringify(o)); }catch(_){}
}
nText.addEventListener('input',()=>{
  if(noteNode){ noteNode.note=nText.value; persist();
    nOk.classList.add('show'); clearTimeout(noteTimer); noteTimer=setTimeout(()=>nOk.classList.remove('show'),1200); }
});
document.getElementById('nClose').onclick=()=>{ closeNote(); setFocus(null); };
function stepNote(dir){
  if(!noteNode) return; const ids=G.nodes; const i=ids.indexOf(noteNode);
  const nx=ids[(i+dir+ids.length)%ids.length]; if(nx){ setFocus(nx); target.x=nx.x; target.y=nx.y; }
}
document.getElementById('nPrev').onclick=()=>stepNote(-1);
document.getElementById('nNext').onclick=()=>stepNote(1);
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- interaction ---------- */
cv.addEventListener('mousedown',e=>{
  const n=pick(e.clientX,e.clientY);
  if(n){ dragNode=n; n.pinned=true; cv.classList.add('dragging'); }
  else { panning=true; cv.classList.add('dragging'); }
  last={x:e.clientX,y:e.clientY};
});
addEventListener('mousemove',e=>{
  hoverNode=dragNode||pick(e.clientX,e.clientY);
  cv.style.cursor = hoverNode? 'pointer' : (panning?'grabbing':'grab');
  if(dragNode){ const [wx,wy]=toWorld(e.clientX,e.clientY); dragNode.x=wx; dragNode.y=wy; dragNode.vx=0; dragNode.vy=0; }
  else if(panning){ target.x-=(e.clientX-last.x)/view.k; target.y-=(e.clientY-last.y)/view.k; view.x=target.x; view.y=target.y; last={x:e.clientX,y:e.clientY}; }
});
addEventListener('mouseup',e=>{
  if(dragNode && Math.hypot(e.clientX-last.x,e.clientY-last.y)<4){ setFocus(dragNode); } // click = focus
  else if(!dragNode && panning && Math.hypot(e.clientX-last.x,e.clientY-last.y)<4){ setFocus(null); }
  dragNode=null; panning=false; cv.classList.remove('dragging');
});
cv.addEventListener('dblclick',e=>{ const n=pick(e.clientX,e.clientY); if(n){n.pinned=false;} });
cv.addEventListener('wheel',e=>{ e.preventDefault(); const [wx,wy]=toWorld(e.clientX,e.clientY); const f=Math.exp(-e.deltaY*0.0012); target.k=Math.max(.2,Math.min(4,target.k*f)); // zoom toward cursor
  target.x=wx-(wx-target.x)*(view.k/target.k); target.y=wy-(wy-target.y)*(view.k/target.k); },{passive:false});
addEventListener('keydown',e=>{ if(e.key==='Escape'){setFocus(null); document.getElementById('q').value=''; query='';} });

// touch
let pinchD=0;
cv.addEventListener('touchstart',e=>{ if(e.touches.length===1){ const t=e.touches[0]; const n=pick(t.clientX,t.clientY); if(n){dragNode=n;n.pinned=true;} else panning=true; last={x:t.clientX,y:t.clientY}; } else if(e.touches.length===2){ pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);} },{passive:true});
cv.addEventListener('touchmove',e=>{ if(e.touches.length===1){ const t=e.touches[0]; if(dragNode){const [wx,wy]=toWorld(t.clientX,t.clientY);dragNode.x=wx;dragNode.y=wy;dragNode.vx=dragNode.vy=0;} else if(panning){target.x-=(t.clientX-last.x)/view.k;target.y-=(t.clientY-last.y)/view.k;view.x=target.x;view.y=target.y;last={x:t.clientX,y:t.clientY};} } else if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(pinchD){target.k=Math.max(.2,Math.min(4,target.k*(d/pinchD)));} pinchD=d; } e.preventDefault(); },{passive:false});
cv.addEventListener('touchend',e=>{ if(dragNode && e.changedTouches.length){ setFocus(dragNode);} dragNode=null;panning=false;pinchD=0; });

/* ---------- UI wiring ---------- */
const ta=document.getElementById('ta'), editor=document.getElementById('editor');
document.getElementById('gen').onclick=()=>{ build(ta.value.trim()||SAMPLE); editor.classList.add('hidden'); };
document.getElementById('sample').onclick=()=>{ ta.value=SAMPLE; build(SAMPLE); };
document.getElementById('toggleEdit').onclick=()=>editor.classList.toggle('hidden');
document.getElementById('fit').onclick=()=>fit(false);
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); const hit=query&&G.nodes.find(n=>n.label.toLowerCase().includes(query)); if(hit){ target.x=hit.x; target.y=hit.y; } });
document.getElementById('png').onclick=async()=>{
  const url=cv.toDataURL('image/png');
  try{ const d=window.claude&&claude.use?await claude.use('downloads'):null;
    if(d){ await d.save({filename:'cerebro.png', data:url}); return; } }catch(_){}
  const a=document.createElement('a'); a.download='cerebro.png'; a.href=url; a.click();
};

// init
ta.value=SAMPLE; build(SAMPLE); render();
</script>
</body>
</html>
